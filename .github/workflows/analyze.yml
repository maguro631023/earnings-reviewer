name: Analyze Earnings Report

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Stock ticker (e.g. NVDA)'
        required: true
        default: 'NVDA'
      period:
        description: 'Period (e.g. Q1_2026)'
        required: true
        default: 'Q1_2026'
      sector:
        description: 'Sector (general / semis / finance)'
        required: false
        default: 'general'
  push:
    paths:
      - 'data/raw/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/ingest/loader.py --ticker ${{ github.event.inputs.ticker }} --period ${{ github.event.inputs.period }}
        continue-on-error: true
      - run: python src/extract/extractor.py --ticker ${{ github.event.inputs.ticker }} --period ${{ github.event.inputs.period }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
      - run: python src/rules_engine/engine.py --ticker ${{ github.event.inputs.ticker }} --period ${{ github.event.inputs.period }} --sector ${{ github.event.inputs.sector }}
        continue-on-error: true
      - run: python src/model/model_updater.py --ticker ${{ github.event.inputs.ticker }} --period ${{ github.event.inputs.period }}
        continue-on-error: true
      - run: python src/report/generator.py --ticker ${{ github.event.inputs.ticker }} --period ${{ github.event.inputs.period }}
        continue-on-error: true
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/data/latest.json || true
          git diff --staged --quiet || git commit -m "ci: update report"
          git push || true
